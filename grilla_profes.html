<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grilla de Profes — Espacio Puna</title>
  <script src="https://cdn.tailwindcss.com" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { font-family: 'Syne', sans-serif; }

    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --header: #1c2a1e;
      --border: #e8e2d9;
      --text: #1a1a1a;
      --muted: #9ca3af;
      --accent: #d97706;
      --green: #16a34a;
      --red: #dc2626;
      --hour-h: 70px;
    }

    body { background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }

    /* ── App header ───────────────── */
    .app-header {
      height: 50px;
      background: var(--header);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { flex: 1; line-height: 1.3; }
    .brand .b-sub { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .4; }
    .brand .b-main { font-size: 14px; font-weight: 800; }
    .tab-btn {
      padding: 5px 12px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      transition: all .12s;
    }
    .tab-btn.on { background: rgba(255,255,255,.15); color: #fff; }
    .tab-btn:not(.on) { background: transparent; color: rgba(255,255,255,.5); }
    .tab-btn:not(.on):hover { color: rgba(255,255,255,.85); }
    .hdr-icon {
      width: 30px; height: 30px;
      background: rgba(255,255,255,.1);
      border: none; border-radius: 7px;
      color: rgba(255,255,255,.65);
      cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .hdr-icon:hover { background: rgba(255,255,255,.2); color: #fff; }
    .hdr-icon.active { background: var(--accent); color: #fff; }

    /* ── Controls bar ─────────────── */
    .ctrl-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      position: sticky;
      top: 50px;
      z-index: 40;
    }
    .f-sel {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 11px;
      font-family: 'Syne', sans-serif;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .f-sel:focus { border-color: var(--accent); }
    .c-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .c-btn {
      padding: 4px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      transition: all .12s;
      white-space: nowrap;
    }
    .c-btn:hover { background: #f4f4f4; }
    .c-btn.on { background: var(--header); color: #fff; border-color: var(--header); }
    .c-btn.on:hover { filter: brightness(1.15); }
    .vtog { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
    .vtog .c-btn { border: none; border-radius: 0; }
    .vtog .c-btn + .c-btn { border-left: 1px solid var(--border); }
    .nav-btn {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: #fff;
      font-size: 13px; font-weight: 700;
      transition: background .12s;
    }
    .nav-btn:hover { background: #f4f4f4; }
    .wk-lbl { font-size: 12px; font-weight: 700; min-width: 140px; text-align: center; white-space: nowrap; }

    /* ── Main layout ──────────────── */
    .main-wrap {
      display: flex;
      height: calc(100vh - 100px);
      overflow: hidden;
    }
    .cal-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ── Coverage bar ─────────────── */
    .cov-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .cov-track { height: 5px; border-radius: 999px; background: #e5e7eb; overflow: hidden; width: 100px; flex-shrink: 0; }
    .cov-fill { height: 100%; border-radius: 999px; transition: width .4s; }
    .cdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 2px; }

    /* ── Config panel ─────────────── */
    .cfg-panel {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
    }
    .cfg-in {
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Syne', sans-serif;
      outline: none;
      color: var(--text);
    }
    .cfg-in:focus { border-color: var(--accent); }

    /* ── Schedule grid ────────────── */
    .sch-wrap { flex: 1; overflow: auto; }
    .sch-outer { display: flex; min-width: 600px; }

    .time-col {
      width: 52px;
      flex-shrink: 0;
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--bg);
    }
    .time-spacer { height: 46px; border-right: 1px solid var(--border); }
    .time-label {
      height: var(--hour-h);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 3px 7px 0 0;
      font-size: 10px;
      color: var(--muted);
      border-right: 1px solid var(--border);
      letter-spacing: .04em;
    }

    .days-grid { display: flex; flex: 1; }
    .day-col { flex: 1; min-width: 90px; border-right: 1px solid var(--border); }
    .day-col:last-child { border-right: none; }

    .day-hdr {
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 8;
    }
    .day-hdr .dn { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--muted); }
    .day-hdr .dd { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.1; }
    .day-hdr .dm { font-size: 9px; color: var(--muted); }
    .day-hdr.today .dd { color: var(--accent); }
    .day-hdr.today::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: block; }

    .day-body { position: relative; }
    .h-ln { position: absolute; left: 0; right: 0; pointer-events: none; }
    .h-ln.full { border-top: 1px solid rgba(0,0,0,.05); }
    .h-ln.half { border-top: 1px dashed rgba(0,0,0,.035); }

    /* ── Availability bands ───────── */
    .avail-band {
      position: absolute; left: 0; right: 0;
      pointer-events: none;
      opacity: .1;
      z-index: 1;
    }

    /* ── Now line ─────────────────── */
    .now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 5; pointer-events: none; }
    .now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

    /* ── Class cards ──────────────── */
    .cls-card {
      position: absolute;
      left: 3px; right: 3px;
      border-radius: 7px;
      padding: 5px 7px 4px 9px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .1s, box-shadow .1s;
      border: 1px solid;
      border-left-width: 3px;
      background: #fff;
      z-index: 2;
    }
    .cls-card:hover { transform: scale(1.025); z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
    .cls-card.cancelled { opacity: .38; filter: grayscale(.5); }

    .c-title { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .c-badge {
      display: inline-flex; align-items: center;
      font-size: 9px; font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      margin: 2px 0 1px;
    }
    .c-cap { position: absolute; top: 5px; right: 6px; font-size: 9px; font-weight: 600; }
    .c-foot { display: flex; align-items: center; gap: 3px; }
    .c-room { font-size: 9px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .i-badge {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── Coverage chips on cards ──── */
    .cov-row { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
    .cov-chip {
      width: 13px; height: 13px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 6px; font-weight: 800;
      color: #fff;
      border: 1.5px solid #fff;
      flex-shrink: 0;
    }
    .cov-none { font-size: 8px; color: var(--red); font-weight: 700; }

    /* ── Profes panel ─────────────── */
    .profes-panel {
      width: 0;
      flex-shrink: 0;
      background: #fff;
      border-left: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .22s ease;
    }
    .profes-panel.open {
      width: 278px;
      border-left: 1px solid var(--border);
    }
    .p-hdr { padding: 11px 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .p-hdr h3 { font-size: 12px; font-weight: 800; margin: 0; }
    .p-body { flex: 1; overflow-y: auto; padding: 10px; }
    .p-foot { padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }

    /* ── Teacher items ────────────── */
    .t-item { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; margin-bottom: 7px; }
    .t-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
    .t-name { font-size: 12px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-stat { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .t-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .t-act-btn { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 11px; border-radius: 4px; color: var(--muted); transition: background .1s; }
    .t-act-btn:hover { background: #eee; color: var(--text); }

    .d-chips { display: flex; gap: 3px; margin-bottom: 5px; }
    .d-chip {
      width: 24px; height: 21px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 9px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: all .1s;
      user-select: none;
    }
    .d-chip.on { color: #fff !important; border-color: transparent !important; }
    .t-time-row { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }

    /* ── Modal ────────────────────── */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #fff; border-radius: 14px; padding: 22px; width: 340px; max-width: 93vw; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
    .m-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; display: block; }
    .m-in {
      width: 100%; padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      font-family: 'Syne', sans-serif;
      outline: none; color: var(--text);
    }
    .m-in:focus { border-color: var(--accent); }

    /* ── Lista table ──────────────── */
    .lista-wrap { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .lista-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .lista-tbl th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
    .lista-tbl td { padding: 8px 10px; border-bottom: 1px solid rgba(0,0,0,.04); vertical-align: middle; }
    .lista-tbl tr:hover td { background: #fafaf8; }

    /* ── Scrollbars ───────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 2px; }

    /* ── Demo banner ──────────────── */
    .demo-banner {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(217,119,6,.1); border: 1px solid rgba(217,119,6,.3);
      color: #78350f; font-size: 11px; padding: 6px 14px;
      border-radius: 999px; z-index: 50; white-space: nowrap;
      animation: fadeup .35s ease;
    }
    @keyframes fadeup { from { opacity:0; transform: translateX(-50%) translateY(7px); } }
  </style>
</head>

<body>
<div id="app">

  <!-- ── APP HEADER ────────────────────────────────────────── -->
  <div class="app-header">
    <div class="brand">
      <div class="b-sub">Espacio Puna</div>
      <div class="b-main">Grilla de Profes</div>
    </div>
    <button class="tab-btn active" id="tab-cal"  onclick="setTab('cal')">Calendario</button>
    <button class="tab-btn"        id="tab-list" onclick="setTab('list')">Lista</button>
    <div style="flex:1"></div>
    <button class="c-btn" id="btn-profes" onclick="toggleProfes()" style="background:rgba(255,255,255,.12)">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
      Profes
    </button>
  </div>

  <!-- ── CONTROLS BAR ──────────────────────────────────────── -->
  <div class="ctrl-bar">
    <select id="f-act"    class="ctrl-sel" onchange="applyFilters()"><option value="">Todas las actividades</option></select>
    <select id="f-instr"  class="ctrl-sel" onchange="applyFilters()"><option value="">Todos los instructores</option></select>
    <select id="f-status" class="ctrl-sel" onchange="applyFilters()">
      <option value="">Todos los estados</option>
      <option value="active">Activo</option>
      <option value="cancelled">Cancelado</option>
    </select>
    <div class="vtog">
      <button class="vtog-btn active" id="vbtn-week" onclick="setView('week')">Semana</button>
      <button class="vtog-btn"        id="vbtn-day"  onclick="setView('day')">Día</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
      <button onclick="changeWeek(-1)" class="c-btn" aria-label="Semana anterior">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="text-align:center;min-width:130px">
        <div id="lbl-week-range" style="font-weight:700;font-size:13px;line-height:1.3">—</div>
        <div id="lbl-week-year"  style="font-size:10px;color:var(--muted)"></div>
      </div>
      <button onclick="changeWeek(1)" class="c-btn" aria-label="Semana siguiente">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button onclick="goToToday()" class="c-btn" style="background:#f97316;color:#fff;border-color:#f97316">Hoy</button>
    </div>
    <button onclick="toggleConfig()" title="Configurar Supabase" class="c-btn">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42m12.72-12.72 1.42-1.42"/></svg>
    </button>
  </div>

  <!-- ── CONFIG PANEL ──────────────────────────────────────── -->
  <div id="cfg-panel" class="hidden" style="padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)">
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Supabase URL</label>
        <input id="cfg-url" type="text" placeholder="https://xxxx.supabase.co" style="border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;width:280px">
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Anon Key</label>
        <input id="cfg-key" type="password" placeholder="eyJhbGciOi…" style="border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;width:280px">
      </div>
      <button onclick="saveConfig()" class="c-btn" style="background:#1c2a1e;color:#fff;border-color:#1c2a1e">Guardar</button>
      <button onclick="useDemoData()" class="c-btn">Demo</button>
    </div>
  </div>

  <!-- ── MAIN LAYOUT ────────────────────────────────────────── -->
  <div class="main-wrap">
    <div class="cal-area">
      <div class="cov-bar" id="cov-bar" style="display:none"></div>
      <div class="sch-wrap" id="sch-wrap">
        <div id="schedule" class="sch-outer"></div>
      </div>
      <div class="lista-wrap" id="lista-wrap" style="display:none">
        <div id="lista"></div>
      </div>
    </div>
    <div class="profes-panel" id="profes-panel">
      <div class="p-body" id="p-body"></div>
      <div class="p-foot">
        <button class="c-btn" onclick="openProfeModal(null)" style="width:100%;justify-content:center;background:#1c2a1e;color:#fff;border-color:#1c2a1e">
          + Agregar profe
        </button>
      </div>
    </div>
  </div>

</div><!-- #app -->

<!-- ── CLASS DETAIL MODAL ─────────────────────────────────── -->
<div id="cls-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center" onclick="if(event.target===this)closeClsModal()">
  <div style="background:#fff;border-radius:16px;padding:24px;width:min(420px,92vw);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">
    <div id="cls-modal-body"></div>
    <button onclick="closeClsModal()" style="margin-top:14px;width:100%;padding:8px;border-radius:9px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#f5f5f5">Cerrar</button>
  </div>
</div>

<!-- ── PROFE MODAL ────────────────────────────────────────── -->
<div id="profe-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center" onclick="if(event.target===this)closeProfeModal()">
  <div style="background:#fff;border-radius:16px;padding:24px;width:min(380px,92vw);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)">
    <div id="profe-modal-body"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════════ */
const CFG = {
  supabaseUrl: localStorage.getItem('puna_sb_url') || '',
  supabaseKey: localStorage.getItem('puna_sb_key') || '',
  startHour: 7,
  endHour: 22,
  HOUR_PX: 70,
};

/* ════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════ */
const DAYS_ES  = ['dom','lun','mar','mi\u00e9','jue','vie','s\u00e1b'];
const MONTHS   = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const T_COLORS = ['#d97706','#7c3aed','#0891b2','#db2777','#2563eb','#16a34a','#ca8a04','#dc2626'];

// Activity palette: [cardBg, leftBorder, badgeBg, badgeText]
const ACT_PAL = [
  ['#fff8f0','#f97316','#fed7aa','#c2410c'],
  ['#f0fdf4','#22c55e','#bbf7d0','#15803d'],
  ['#f0f9ff','#3b82f6','#bfdbfe','#1d4ed8'],
  ['#fdf4ff','#a855f7','#e9d5ff','#7e22ce'],
  ['#fefce8','#ca8a04','#fef08a','#854d0e'],
  ['#fdf2f8','#ec4899','#fbcfe8','#9d174d'],
  ['#f0fdfa','#0d9488','#99f6e4','#0f766e'],
  ['#fff1f2','#f43f5e','#fecdd3','#9f1239'],
];
let _aMap = {}, _aIdx = 0;
function actPal(name) {
  if (!_aMap[name]) { _aMap[name] = ACT_PAL[_aIdx % ACT_PAL.length]; _aIdx++; }
  return _aMap[name];
}
let _iMap = {}, _iIdx = 0;
function instrColor(name) {
  if (!_iMap[name]) { _iMap[name] = T_COLORS[_iIdx % T_COLORS.length]; _iIdx++; }
  return _iMap[name];
}

function pad2(n) { return String(n).padStart(2,'0'); }
function fmtTime(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function weekBounds(off=0) {
  const now = new Date();
  const dow = now.getDay();
  const toMon = dow===0 ? -6 : 1-dow;
  const mon = new Date(now); mon.setDate(now.getDate()+toMon+off*7); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return {start:mon, end:sun};
}
function weekDays(off=0) {
  const {start} = weekBounds(off);
  return Array.from({length:7},(_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
}

   FETCH

async function fetchClasses(start, end) {
  if (!CFG.supabaseUrl || !CFG.supabaseKey) return null;
  const url = new URL(`${CFG.supabaseUrl}/rest/v1/classes`);
  url.searchParams.set('select','id,name,instructor,scheduled_at,duration_minutes,max_capacity,status,activities(name)');
  url.searchParams.set('scheduled_at', `gte.${start.toISOString()}`);
  url.searchParams.append('scheduled_at', `lte.${end.toISOString()}`);
  url.searchParams.set('order','scheduled_at');
  const res = await fetch(url.toString(), {
    headers: { apikey: CFG.supabaseKey, Authorization: `Bearer ${CFG.supabaseKey}` }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  return res.json();
}

/* ════════════════════════════════════════════════
   COVERAGE
════════════════════════════════════════════════ */
function getAvailTeachers(scheduledAt) {
  const d = new Date(scheduledAt);
  const dow = d.getDay();
  const mm  = d.getHours()*60 + d.getMinutes();
  return teachers.filter(t => {
    if (!t.avail.days.includes(dow)) return false;
    const [sh,sm] = t.avail.start.split(':').map(Number);
    const [eh,em] = t.avail.end.split(':').map(Number);
    return mm >= sh*60+sm && mm < eh*60+em;
  });
}

function computeCoverage(cls) {
  const active = cls.filter(c=>c.status!=='cancelled');
  if (!active.length || !teachers.length) return null;
  const covered = active.filter(c=>getAvailTeachers(c.scheduled_at).length>0).length;
  return Math.round(covered/active.length*100);
}

/* ════════════════════════════════════════════════
   RENDER GRID
════════════════════════════════════════════════ */
function renderGrid(days, classes) {
  const HOURS = CFG.endHour - CFG.startHour;
  const TOTAL_PX = HOURS * CFG.HOUR_PX;
  const isThisWeek = weekOffset === 0;

  // Availability bands per day
  const bands = {};
  days.forEach((day,di) => {
    const dow = day.getDay();
    bands[di] = teachers.filter(t=>t.avail.days.includes(dow)).map(t => {
      const [sh,sm]=t.avail.start.split(':').map(Number);
      const [eh,em]=t.avail.end.split(':').map(Number);
      const gS=CFG.startHour*60;
      const topMin=Math.max(sh*60+sm-gS,0);
      const botMin=Math.min(eh*60+em-gS,HOURS*60);
      if (botMin<=topMin) return null;
      return {color:t.color,topPx:(topMin/60)*CFG.HOUR_PX,h:((botMin-topMin)/60)*CFG.HOUR_PX};
    }).filter(Boolean);
  });

  let html = `<div class="time-col"><div class="time-spacer"></div>`;
  for (let h=CFG.startHour;h<CFG.endHour;h++) html+=`<div class="time-label">${pad2(h)}:00</div>`;
  html+=`</div><div class="days-grid">`;

  days.forEach((day,di) => {
    const today = isToday(day);
    const dayC = classes.filter(c => {
      const cd=new Date(c.scheduled_at);
      return cd.getDate()===day.getDate()&&cd.getMonth()===day.getMonth()&&cd.getFullYear()===day.getFullYear();
    });

    html+=`<div class="day-col">
      <div class="day-hdr${today?' today':''}">
        <span class="dn">${DAYS_ES[day.getDay()]}</span>
        <span class="dd">${day.getDate()}</span>
        <span class="dm">${MONTHS[day.getMonth()]}</span>
      </div>
      <div class="day-body" style="height:${TOTAL_PX}px">`;

    for (let h=0;h<HOURS;h++) {
      html+=`<div class="h-ln full" style="top:${h*CFG.HOUR_PX}px"></div>`;
      html+=`<div class="h-ln half" style="top:${h*CFG.HOUR_PX+CFG.HOUR_PX/2}px"></div>`;
    }
    (bands[di]||[]).forEach(b=>{
      html+=`<div class="avail-band" style="top:${b.topPx}px;height:${b.h}px;background:${b.color}"></div>`;
    });
    if (today&&isThisWeek) {
      const now=new Date();
      const mft=(now.getHours()-CFG.startHour)*60+now.getMinutes();
      if (mft>=0&&mft<HOURS*60) html+=`<div class="now-line" style="top:${(mft/60)*CFG.HOUR_PX}px"></div>`;
    }

    dayC.forEach(cls => {
      const sd=new Date(cls.scheduled_at);
      const ed=new Date(sd.getTime()+cls.duration_minutes*60000);
      const minT=(sd.getHours()-CFG.startHour)*60+sd.getMinutes();
      const topPx=(minT/60)*CFG.HOUR_PX;
      const hPx=Math.max((cls.duration_minutes/60)*CFG.HOUR_PX-5,22);
      const actName=cls.activities?.name||cls.name;
      const [cardBg,lBorder,badgeBg,badgeTxt]=actPal(actName);
      const iColor=instrColor(cls.instructor);
      const cancelled=cls.status==='cancelled';
      const avT=getAvailTeachers(cls.scheduled_at);
      const showCov=teachers.length>0;
      const leftBorder=showCov?(avT.length>0?'#16a34a':'#dc2626'):lBorder;
      const bk=cls.bookings_count!=null?cls.bookings_count:'\u2014';
      const capC=typeof cls.bookings_count==='number'&&cls.max_capacity>0
        ?(cls.bookings_count>=cls.max_capacity?'#dc2626':cls.bookings_count>=cls.max_capacity*.8?'#ca8a04':'#9ca3af'):'#9ca3af';
      let covHtml='';
      if (showCov&&hPx>50) {
        covHtml=avT.length>0
          ?`<div class="cov-row">${avT.slice(0,4).map(t=>`<div class="cov-chip" style="background:${t.color}" title="${esc(t.name)}">${t.name.charAt(0).toUpperCase()}</div>`).join('')}${avT.length>4?`<span style="font-size:8px;color:var(--muted)">+${avT.length-4}</span>`:''}</div>`
          :`<div class="cov-row"><span class="cov-none">\u26a0 Sin profe</span></div>`;
      }
      html+=`<div class="cls-card${cancelled?' cancelled':''}" data-id="${esc(String(cls.id))}"
        style="top:${topPx}px;height:${hPx}px;border-color:${lBorder};border-left-color:${leftBorder}">
        <div class="c-cap" style="color:${capC}">${bk}/${cls.max_capacity}</div>
        <div class="c-title">${esc(actName)}</div>
        ${hPx>33?`<div><span class="c-badge" style="background:${badgeBg};color:${badgeTxt}">${esc(actName)}</span></div>`:''}
        ${hPx>44?`<div class="c-foot"><div class="i-badge" style="background:${iColor}">${(cls.instructor||'?').charAt(0).toUpperCase()}</div><span class="c-room">${esc(cls.room||'Sal\u00f3n 1')}</span></div>`:''}
        ${covHtml}
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  const schedEl=document.getElementById('schedule');
  schedEl.innerHTML=html;
  schedEl.onclick=e=>{
    const card=e.target.closest('[data-id]');
    if (!card) return;
    const cls=filteredClasses.find(c=>String(c.id)===card.dataset.id);
    if (cls) openClsModal(cls);
  };
}

  document.getElementById('pm-name').value=t?t.name:'';
  document.getElementById('pm-start').value=t?t.avail.start:'07:00';
  document.getElementById('pm-end').value=t?t.avail.end:'14:00';
  renderColorPicker(); renderDayPicker();
  document.getElementById('profe-modal').style.display='flex';
  setTimeout(()=>document.getElementById('pm-name').focus(),50);
}
function closeProfeModal(){document.getElementById('profe-modal').style.display='none';}

function renderColorPicker() {
  document.getElementById('pm-colors').innerHTML=T_COLORS.map(c=>
    `<div onclick="selectColor('${c}')" style="width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;box-shadow:${c===pmColor?`0 0 0 3px #fff,0 0 0 5px ${c}`:'none'};transition:box-shadow .1s"></div>`
  ).join('');
}
function selectColor(c){pmColor=c;renderColorPicker();renderDayPicker();}

function renderDayPicker() {
  const L=['Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b'];
  document.getElementById('pm-days').innerHTML=[0,1,2,3,4,5,6].map(d=>
    `<div class="d-chip${pmDays.has(d)?' on':''}" style="${pmDays.has(d)?`background:${pmColor};border-color:${pmColor}`:''}" onclick="toggleDay(${d})">${L[d]}</div>`
  ).join('');
}
function toggleDay(d){if(pmDays.has(d)){if(pmDays.size>1)pmDays.delete(d);}else pmDays.add(d);renderDayPicker();}

function saveProfe(){
  const name=document.getElementById('pm-name').value.trim();
  if(!name){document.getElementById('pm-name').focus();return;}
  const start=document.getElementById('pm-start').value;
  const end=document.getElementById('pm-end').value;
  if(start>=end){alert('El horario de inicio debe ser anterior al fin');return;}
  const profe={id:editingId||`t${Date.now()}`,name,color:pmColor,avail:{days:[...pmDays],start,end}};
  if(editingId) teachers=teachers.map(t=>t.id===editingId?profe:t);
  else teachers.push(profe);
  localStorage.setItem('puna_teachers',JSON.stringify(teachers));
  closeProfeModal();
  rerender();
  if(!document.getElementById('profes-panel').classList.contains('open')) toggleProfes();
}

function deleteProfe(id){
  if(!confirm('\u00bfEliminar profe?')) return;
  teachers=teachers.filter(t=>t.id!==id);
  localStorage.setItem('puna_teachers',JSON.stringify(teachers));
  rerender();
  renderProfesPanel();
}

/* ════════════════════════════════════════════════
   VIEW / TAB
════════════════════════════════════════════════ */
function setTab(tab){
  currentTab=tab;
  document.getElementById('tab-cal').classList.toggle('on',tab==='cal');
  document.getElementById('tab-list').classList.toggle('on',tab==='list');
  document.getElementById('sch-wrap').style.display=tab==='cal'?'block':'none';
  document.getElementById('lista-wrap').style.display=tab==='list'?'block':'none';
  if(tab==='list') renderLista(filteredClasses);
}
function setView(v){
  document.getElementById('vbtn-day').classList.toggle('on',v==='day');
  document.getElementById('vbtn-week').classList.toggle('on',v==='week');
  rerender();
}

/* ════════════════════════════════════════════════
   CONFIG PANEL
════════════════════════════════════════════════ */
function toggleConfig(){
  const p=document.getElementById('cfg-panel');
  const show=p.style.display==='none'||!p.style.display;
  p.style.display=show?'block':'none';
  if(show){document.getElementById('cfg-url').value=CFG.supabaseUrl;document.getElementById('cfg-key').value=CFG.supabaseKey;}
}
function saveConfig(){
  CFG.supabaseUrl=document.getElementById('cfg-url').value.trim().replace(/\/$/,'');
  CFG.supabaseKey=document.getElementById('cfg-key').value.trim();
  localStorage.setItem('puna_sb_url',CFG.supabaseUrl);
  localStorage.setItem('puna_sb_key',CFG.supabaseKey);
  document.getElementById('cfg-panel').style.display='none';
  load();
}
function useDemoData(){CFG.supabaseUrl='';CFG.supabaseKey='';document.getElementById('cfg-panel').style.display='none';load();}

/* ════════════════════════════════════════════════
   PROFES PANEL
════════════════════════════════════════════════ */
function toggleProfes(){
  const panel=document.getElementById('profes-panel');
  const btn=document.getElementById('btn-profes');
  const isOpen=panel.classList.contains('open');
  panel.classList.toggle('open',!isOpen);
  btn.classList.toggle('active',!isOpen);
  if(!isOpen) renderProfesPanel();
}

/* ════════════════════════════════════════════════
   DEMO BANNER
════════════════════════════════════════════════ */
let _bannerShown=false;
function showBanner(msg){
  if(_bannerShown) return; _bannerShown=true;
  const el=document.createElement('div');
  el.className='demo-banner'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),7000);
}

/* ════════════════════════════════════════════════
   RERENDER
════════════════════════════════════════════════ */
function rerender(){
  _aMap={}; _aIdx=0; _iMap={}; _iIdx=0;
  renderLabel();
  const days=weekDays(weekOffset);
  renderGrid(days,filteredClasses);
  renderCovBar();
  if(currentTab==='list') renderLista(filteredClasses);
  if(document.getElementById('profes-panel').classList.contains('open')) renderProfesPanel();
}

/* ════════════════════════════════════════════════
   MAIN LOAD
════════════════════════════════════════════════ */
async function load(){
  _bannerShown=false;
  _aMap={}; _aIdx=0; _iMap={}; _iIdx=0;
  renderLabel();
  const days=weekDays(weekOffset);
  const {start,end}=weekBounds(weekOffset);
  document.getElementById('schedule').innerHTML=
    `<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);font-size:13px">Cargando clases\u2026</div>`;
  try {
    const data=await fetchClasses(start,end);
    if(!data){allClasses=demoData(days);showBanner('Sin Supabase \u2014 datos de demostraci\u00f3n. Config con \u2699');}
    else allClasses=data;
  } catch(err){
    allClasses=demoData(days);
    showBanner(`Error Supabase: ${err.message} \u2014 datos de demostraci\u00f3n`);
  }
  populateFilters();
  filteredClasses=[...allClasses];
  renderGrid(days,filteredClasses);
  renderCovBar();
  if(document.getElementById('profes-panel').classList.contains('open')) renderProfesPanel();
}

function changeWeek(d){weekOffset+=d;load();}
function goToToday(){weekOffset=0;load();}

load();
</script>
</body>
</html>
